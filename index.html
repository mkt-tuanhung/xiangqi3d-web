<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e0f11">
  <meta name="description" content="Cờ tướng 3D — Kỷ Dậu 1789, Tây Sơn đại phá quân Thanh: Quang Trung Hoàng Đế đối đầu Tôn Sĩ Nghị. Chơi với máy, hai người, hoặc quét mã QR để đấu qua mạng và xem trận.">
  <title>Cờ Tướng 3D — Tây Sơn đại phá quân Thanh (1789)</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0e0f11; overflow: hidden; color: #eae4d6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0e0f11;
      touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: radial-gradient(circle at 50% 40%, #1d1b18 0%, #0e0f11 70%); }
    #loading h1 { margin: 0; font-size: 30px; letter-spacing: 8px; color: #c9a24a; font-weight: 700; }
    #loading p { margin: 0; font-size: 14px; color: #a0998c; }
    #bar { width: min(320px, 70vw); height: 6px; background: #26282c; border-radius: 3px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #c9a24a; transition: width .2s; }
    #studio { position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); text-align: center;
      font-size: 12px; letter-spacing: 6px; color: #8c7a52; }
    #err { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: #7a1a12; color: #fff; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>CỜ TƯỚNG 3D</h1>
    <p>Kỷ Dậu 1789 · Tây Sơn đại phá quân Thanh</p>
    <div id="bar"><div id="fill"></div></div>
    <p id="pct">0%</p>
    <div id="studio">MINH DUNG PRODUCTION</div>
  </div>
  <div id="err"></div>
  <script>
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    function fail(msg) { var e = document.getElementById('err'); e.textContent = msg; e.style.display = 'block'; }
    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Minh Dung Production",
      productName: "Xiangqi 3D Realistic",
      productVersion: "0.5.0",
      // Phones have 3x screens: rendering at 2x keeps it sharp without burning the GPU.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobile ? 2 : 1.5),
      showBanner: function (msg, type) { if (type === 'error') fail(msg); else console.warn(msg); }
    };
    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        document.getElementById('fill').style.width = (100 * p) + '%';
        document.getElementById('pct').textContent = Math.round(100 * p) + '%';
      }).then(function () {
        document.getElementById('loading').style.display = 'none';
      }).catch(function (m) { fail('Không tải được trò chơi: ' + m); });
    };
    script.onerror = function () { fail('Không tải được trò chơi — kiểm tra kết nối mạng rồi tải lại trang.'); };
    document.body.appendChild(script);
  </script>
</body>
</html>
